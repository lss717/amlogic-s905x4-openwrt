# Default module options for the OpenVFD driver on HK1 RBOX X4 (S905X4).
# Keeps the correct pins/controller even if the module is auto-loaded by
# the platform device modalias before openwrt-openvfd passes its arguments.
options openvfd vfd_gpio_clk=0,1,0 vfd_gpio_dat=0,0,0 vfd_gpio_stb=0,0,0xFF vfd_gpio_protocol=0,0 vfd_chars=0,4,3,2,1 vfd_dot_bits=0,1,3,2,4,5,6 vfd_display_type=0x00,0x00,0x00,0x06
