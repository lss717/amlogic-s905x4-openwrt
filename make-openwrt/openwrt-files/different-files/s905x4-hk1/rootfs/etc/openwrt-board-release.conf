#===========================================================================
#
# This file is a part of the Remake OpenWrt
# https://github.com/ophub/amlogic-s9xxx-openwrt
#
# HK1 RBOX X4 / Amlogic S905X4 (SC2), 4GB-Mem, 1Gb-Nic, BCM4339 wifi, IR remote
#
# Configuration: /etc/model_database.conf
# MODEL_ID="529"
# MODEL_BOARD="s905x4-hk1"
# SOC="s905x4"
#
# There is no open u-boot for SC2: the image is booted by the stock vendor
# u-boot which runs aml_autoscript from the FAT boot partition. Keep the boot
# partition at 16 MiB (same offset as the known-working DevMFC layout).
#
#===========================================================================
skip_mb="16"

# The stock vendor u-boot of these boxes only reads a FAT16 boot partition
# (verified against the working DevMFC image, which is FAT16).
boot_mb="256"
boot_fat_type="16"
