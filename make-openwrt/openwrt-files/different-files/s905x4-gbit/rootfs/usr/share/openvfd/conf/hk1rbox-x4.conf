# HK1 RBOX X4 (Amlogic S905X4) OpenVFD configuration
#
# gpio_xxx: '<bank>,<pin>,<flags>'
#   bank 0 = &gpio (periphs-banks); SC2: GPIOA_14 = offset 0, GPIOA_15 = offset 1
#   flags 0xFF is used to skip an unused pin
#
# The board wires the FD6551 as: clk = GPIOA_15, dat = GPIOA_14
# (same pins as the disabled i2c-gpio "i2c-led" node).

vfd_gpio_clk='0,1,0'
vfd_gpio_dat='0,0,0'
vfd_gpio_stb='0,0,0xFF'

# chars: < DHHMM > order of the display chars (D = dots)
vfd_chars='0,4,3,2,1'

# dot_bits: Alarm USB Play Pause Col Ethernet Wifi
vfd_dot_bits='0,1,3,2,4,5,6'

# display_type: [0] type, [1] reserved, [2] flags, [3] controller (0x06 = FD6551)
vfd_display_type='0x00,0x00,0x00,0x06'

# Status icons are driven at runtime by /usr/bin/openvfd-icons, based on the
# actual USB / Ethernet / WiFi state. Keep this empty so nothing is forced on
# at boot (the script owns usb/eth/wifi; alarm/play/pause stay off).
functions=''
